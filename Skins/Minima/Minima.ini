; ============================================================
;  MINIMA - typography-first system monitor for Rainmeter
;  CPU / RAM / GPU (iGPU + dGPU) / Storage + temperatures
;  Visual language inspired by the "Mond" skin (ApexXx-SenSei)
;
;  Requires: Rainmeter 4.5+ and HWiNFO running (Sensors window)
;  CPU / RAM / Storage usage : Rainmeter built-ins
;  CPU temp, GPU usage/temp  : HWiNFO (registry export)
;
;  Resize: scroll wheel over the skin, or right-click menu.
; ============================================================

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
MouseScrollUpAction=[!CommandMeasure mScale "ScaleBy(0.05)"]
MouseScrollDownAction=[!CommandMeasure mScale "ScaleBy(-0.05)"]
ContextTitle=Size: Small (0.75x)
ContextAction=[!CommandMeasure mScale "ScaleTo(0.75)"]
ContextTitle2=Size: Medium (1.0x)
ContextAction2=[!CommandMeasure mScale "ScaleTo(1)"]
ContextTitle3=Size: Large (1.25x)
ContextAction3=[!CommandMeasure mScale "ScaleTo(1.25)"]
ContextTitle4=Size: XL (1.5x)
ContextAction4=[!CommandMeasure mScale "ScaleTo(1.5)"]
ContextTitle5=Size: XXL (2x)
ContextAction5=[!CommandMeasure mScale "ScaleTo(2)"]

[Metadata]
Name=Minima
Author=ARIMANIUS(COCSERVERMAN)
Information=Minimal, typography-first system monitor: CPU, RAM, GPU (iGPU/dGPU aware), storage and temperatures (HWiNFO). Scroll to resize.
Version=1.2.0
License=MIT

@Include=#@#Variables.inc

; ------------------------------------------------------------
;  MEASURES
; ------------------------------------------------------------

; ----- Resize helper (functions live in sensors.lua) -----
[mScale]
Measure=Script
ScriptFile=#@#Scripts\sensors.lua
Mode=None

; ----- HWiNFO registry slots -----
; HWiNFO lists every reading you flag with "Report value in Gadget"
; as Label/Sensor/Value 0, 1, 2 ... The script searches these slots.
; Slot count is HwSlots in Variables.inc.
; These must stay ABOVE the Script measures.

[mHwLabel0]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=#HwRegKey#
RegValue=Label0

[mHwSensor0]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=#HwRegKey#
RegValue=Sensor0

[mHwValue0]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=#HwRegKey#
RegValue=Value0

[mHwLabel1]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=#HwRegKey#
RegValue=Label1

