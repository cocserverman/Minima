; ----- CPU -----
[mCPU]
Measure=CPU

[mCPUTemp]
Measure=Script
ScriptFile=#@#Scripts\sensors.lua
Slots=#HwSlots#
Labels=#HwCpuTempLabel#
Clamp=150

; ----- RAM -----
[mRAMUsed]
Measure=PhysicalMemory

[mRAMTotal]
Measure=PhysicalMemory
Total=1
UpdateDivider=-1

[mRAMPct]
Measure=Calc
Formula=mRAMTotal > 0 ? mRAMUsed / mRAMTotal * 100 : 0
MinValue=0
MaxValue=100

[mRAMUsedGB]
Measure=Calc
Formula=mRAMUsed / 1073741824

[mRAMTotalGB]
Measure=Calc
Formula=mRAMTotal / 1073741824

; ----- GPU: raw readings, one set per GPU -----
; Same labels on both GPUs, told apart by the sensor name filter.

[mGPUiLoad]
Measure=Script
ScriptFile=#@#Scripts\sensors.lua
Slots=#HwSlots#
Labels=#HwGpuLoadLabel#
Sensor=#HwIGpuSensor#
Clamp=100

[mGPUiTemp]
Measure=Script
ScriptFile=#@#Scripts\sensors.lua
Slots=#HwSlots#
Labels=#HwGpuTempLabel#
Sensor=#HwIGpuSensor#
Clamp=150
Fallback=mCPUTemp

[mGPUdLoad]
Measure=Script
ScriptFile=#@#Scripts\sensors.lua
Slots=#HwSlots#
Labels=#HwGpuLoadLabel#
Sensor=#HwDGpuSensor#
Clamp=100

[mGPUdTemp]
Measure=Script
ScriptFile=#@#Scripts\sensors.lua
Slots=#HwSlots#
Labels=#HwGpuTempLabel#
Sensor=#HwDGpuSensor#
Clamp=150

; ----- GPU: which one is in use? (1 = dGPU, 0 = iGPU) -----
; No iGPU reading        -> dGPU
; dGPU awake and loaded  -> dGPU
; anything else          -> iGPU
[mGPUActive]
Measure=Calc
Formula=mGPUiLoad < 0 ? 1 : (mGPUdTemp > 0 ? (mGPUdLoad >= #GpuThreshold# ? 1 : 0) : 0)

; ----- GPU: what the meters display -----
[mGPU]
Measure=Script
ScriptFile=#@#Scripts\sensors.lua
Mode=Pick
Select=mGPUActive
A=mGPUiLoad
B=mGPUdLoad
TagA=iGPU
TagB=dGPU
MinValue=0
MaxValue=100

[mGPUTemp]
Measure=Script
ScriptFile=#@#Scripts\sensors.lua
Mode=Pick
Select=mGPUActive
A=mGPUiTemp
B=mGPUdTemp

; ----- STORAGE -----
[mDiskFree]
Measure=FreeDiskSpace
Drive=#Drive#
IgnoreRemovable=0
UpdateDivider=10

[mDiskTotal]
Measure=FreeDiskSpace
Drive=#Drive#
Total=1
IgnoreRemovable=0
UpdateDivider=30

[mDiskPct]
Measure=Calc
Formula=mDiskTotal > 0 ? (mDiskTotal - mDiskFree) / mDiskTotal * 100 : 0
MinValue=0
MaxValue=100
UpdateDivider=10

[mDiskUsedGB]
Measure=Calc
Formula=(mDiskTotal - mDiskFree) / 1073741824
UpdateDivider=10

[mDiskTotalGB]
Measure=Calc
Formula=mDiskTotal / 1073741824
UpdateDivider=30

; ------------------------------------------------------------
;  STYLES
; ------------------------------------------------------------

[sBase]
DynamicVariables=1
AntiAlias=1
FontFace=#FontBody#

[sLabel]
FontSize=#FsLabel#
FontWeight=700
FontColor=#ColDim#

[sBig]
FontSize=#FsBig#
FontWeight=300
FontColor=#ColText#

[sPct]
FontSize=#FsPct#
FontWeight=300
FontColor=#ColMuted#

[sSide]
FontSize=#FsSide#
FontWeight=500
FontColor=#ColSoft#
StringAlign=Right

[sBar]
W=#W#
H=#BarH#
BarColor=#ColText#
SolidColor=#ColTrack#
BarOrientation=Horizontal

; ------------------------------------------------------------
;  METERS
; ------------------------------------------------------------

[mtBackground]
Meter=Image
W=#SkinW#
H=#SkinH#
SolidColor=#ColBg#

[mtTitle]
Meter=String
MeterStyle=sBase
FontFace=#FontTitle#
FontSize=#TitleSize#
FontColor=#ColText#
X=#P#
Y=#P#
Text=SYSTEM

; ----- CPU -----
[mtCPULabel]
Meter=String
MeterStyle=sBase | sLabel
X=#P#
Y=#Y1#
Text=C P U

[mtCPUBig]
Meter=String
MeterStyle=sBase | sBig
X=#P#
Y=(#Y1# + #OffBig#)
Text=[mCPU:0]

[mtCPUPct]
Meter=String
MeterStyle=sBase | sPct
X=#PctGap#R
Y=(#Y1# + #OffPct#)
Text=%

[mtCPUSide]
Meter=String
MeterStyle=sBase | sSide
X=(#P# + #W#)
Y=(#Y1# + #OffSide#)
Text=[&mCPUTemp:Temp()]

[mtCPUBar]
Meter=Bar
MeterStyle=sBar
MeasureName=mCPU
X=#P#
Y=(#Y1# + #OffBar#)

; ----- RAM -----
[mtRAMLabel]
Meter=String
MeterStyle=sBase | sLabel
X=#P#
Y=#Y2#
Text=R A M

[mtRAMBig]
Meter=String
MeterStyle=sBase | sBig
X=#P#
Y=(#Y2# + #OffBig#)
Text=[mRAMPct:0]

[mtRAMPct]
Meter=String
MeterStyle=sBase | sPct
X=#PctGap#R
Y=(#Y2# + #OffPct#)
Text=%

[mtRAMSide]
Meter=String
MeterStyle=sBase | sSide
X=(#P# + #W#)
Y=(#Y2# + #OffSide#)
Text=[mRAMUsedGB:1] / [mRAMTotalGB:0] GB

[mtRAMBar]
Meter=Bar
MeterStyle=sBar
MeasureName=mRAMPct
X=#P#
Y=(#Y2# + #OffBar#)

; ----- GPU -----
[mtGPULabel]
Meter=String
MeterStyle=sBase | sLabel
X=#P#
Y=#Y3#
Text=G P U

; Orange indicator: tag text + small square, right end of the label row
[mtGPUTag]
Meter=String
MeterStyle=sBase | sLabel
FontColor=#ColAccent#
StringAlign=Right
X=(#P# + #W# - #DotSize# - #DotGap#)
Y=#Y3#
Text=[&mGPU:Tag()]

[mtGPUDot]
Meter=Image
SolidColor=#ColAccent#
W=#DotSize#
H=#DotSize#
X=(#P# + #W# - #DotSize#)
Y=(#Y3# + #DotNudge#)

[mtGPUBig]
Meter=String
MeterStyle=sBase | sBig
X=#P#
Y=(#Y3# + #OffBig#)
Text=[&mGPU:Num()]

[mtGPUPct]
Meter=String
MeterStyle=sBase | sPct
X=#PctGap#R
Y=(#Y3# + #OffPct#)
Text=%

[mtGPUSide]
Meter=String
MeterStyle=sBase | sSide
X=(#P# + #W#)
Y=(#Y3# + #OffSide#)
Text=[&mGPUTemp:Temp()]

[mtGPUBar]
Meter=Bar
MeterStyle=sBar
MeasureName=mGPU
X=#P#
Y=(#Y3# + #OffBar#)

; ----- STORAGE -----
[mtDiskLabel]
Meter=String
MeterStyle=sBase | sLabel
X=#P#
Y=#Y4#
Text=S T O R A G E   #Drive#

[mtDiskBig]
Meter=String
MeterStyle=sBase | sBig
X=#P#
Y=(#Y4# + #OffBig#)
Text=[mDiskPct:0]

[mtDiskPct]
Meter=String
MeterStyle=sBase | sPct
X=#PctGap#R
Y=(#Y4# + #OffPct#)
Text=%

[mtDiskSide]
Meter=String
MeterStyle=sBase | sSide
X=(#P# + #W#)
Y=(#Y4# + #OffSide#)
Text=[mDiskUsedGB:0] / [mDiskTotalGB:0] GB

[mtDiskBar]
Meter=Bar
MeterStyle=sBar
MeasureName=mDiskPct
X=#P#
Y=(#Y4# + #OffBar#)

; ----- DEBUG (set Hidden=0 to see what the registry returns) -----
[mtDebug]
Meter=String
MeterStyle=sBase
Hidden=1
FontSize=9
FontColor=FFFFFF
X=#P#
Y=#SkinH#
Text=0: [mHwLabel0] | [mHwSensor0] = [mHwValue0]#CRLF#1: [mHwLabel1] | [mHwSensor1] = [mHwValue1]#CRLF#2: [mHwLabel2] | [mHwSensor2] = [mHwValue2]#CRLF#3: [mHwLabel3] | [mHwSensor3] = [mHwValue3]#CRLF#4: [mHwLabel4] | [mHwSensor4] = [mHwValue4]#CRLF#5: [mHwLabel5] | [mHwSensor5] = [mHwValue5]#CRLF#6: [mHwLabel6] | [mHwSensor6] = [mHwValue6]#CRLF#7: [mHwLabel7] | [mHwSensor7] = [mHwValue7]#CRLF#8: [mHwLabel8] | [mHwSensor8] = [mHwValue8]#CRLF#9: [mHwLabel9] | [mHwSensor9] = [mHwValue9]#CRLF##CRLF#iL=[mGPUiLoad] iT=[mGPUiTemp] dL=[mGPUdLoad] dT=[mGPUdTemp] active=[mGPUActive] cpuT=[mCPUTemp]