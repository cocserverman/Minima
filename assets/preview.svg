<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Minima widget preview with palette and type specimen">
  <defs>
    <style>
      text{font-family:Quicksand,'Segoe UI','Helvetica Neue',Arial,sans-serif}
      .lab{font-size:9px;font-weight:700;fill:#858585}
      .big{font-size:32px;font-weight:300;fill:#FFFFFF}
      .pct{font-size:13px;font-weight:300;fill:#B8B8B8}
      .side{font-size:12px;font-weight:500;fill:#EAEAEA;text-anchor:end}
      .tag{font-size:9px;font-weight:700;fill:#FF6A00;text-anchor:end}
      .track{fill:#FFFFFF;fill-opacity:.15}
      .bar{fill:#FFFFFF}
      .cap{font-size:11px;font-weight:700;letter-spacing:4px;fill:#858585}
      .hex{font-size:10px;font-weight:500;fill:#858585;text-anchor:middle}
      .disp{font-family:Anurati,'Segoe UI','Helvetica Neue',Arial,sans-serif;font-weight:300}
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="639" rx="20" fill="#101010" stroke="#252525"/>

  <!-- ===== Widget mock ===== -->
  <g transform="translate(110 70) scale(1.4)">
    <rect width="348" height="386" rx="4" fill="#151515" stroke="#252525"/>
    <text class="disp" x="24" y="52" font-size="30" letter-spacing="6" fill="#FFFFFF">SYSTEM</text>

    <!-- CPU -->
    <text class="lab" x="24" y="88">C P U</text>
    <text class="big" x="24" y="119">12<tspan class="pct">%</tspan></text>
    <text class="side" x="324" y="119">48 C</text>
    <rect class="track" x="24" y="138" width="300" height="2"/>
    <rect class="bar" x="24" y="138" width="36" height="2">
      <animate attributeName="width" values="36;78;24;54;36" dur="8s" repeatCount="indefinite"/>
    </rect>

    <!-- RAM -->
    <text class="lab" x="24" y="162">R A M</text>
    <text class="big" x="24" y="193">41<tspan class="pct">%</tspan></text>
    <text class="side" x="324" y="193">13.1 / 32 GB</text>
    <rect class="track" x="24" y="212" width="300" height="2"/>
    <rect class="bar" x="24" y="212" width="123" height="2"/>

    <!-- GPU label -->
    <text class="lab" x="24" y="236">G P U</text>

    <!-- GPU state A: iGPU -->
    <g>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="10s" repeatCount="indefinite"/>
      <text class="tag" x="314" y="236">iGPU</text>
      <rect x="319" y="231" width="5" height="5" fill="#FF6A00"/>
      <text class="big" x="24" y="267">3<tspan class="pct">%</tspan></text>
      <text class="side" x="324" y="267">47 C</text>
      <rect class="track" x="24" y="286" width="300" height="2"/>
      <rect class="bar" x="24" y="286" width="9" height="2"/>
    </g>

    <!-- GPU state B: dGPU -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.5;0.95;1" dur="10s" repeatCount="indefinite"/>
      <text class="tag" x="314" y="236">dGPU</text>
      <rect x="319" y="231" width="5" height="5" fill="#FF6A00"/>
      <text class="big" x="24" y="267">71<tspan class="pct">%</tspan></text>
      <text class="side" x="324" y="267">63 C</text>
      <rect class="track" x="24" y="286" width="300" height="2"/>
      <rect class="bar" x="24" y="286" width="213" height="2"/>
    </g>

    <!-- Storage -->
    <text class="lab" x="24" y="310" xml:space="preserve">S T O R A G E   C:</text>
    <text class="big" x="24" y="341">63<tspan class="pct">%</tspan></text>
    <text class="side" x="324" y="341">301 / 476 GB</text>
    <rect class="track" x="24" y="360" width="300" height="2"/>
    <rect class="bar" x="24" y="360" width="189" height="2"/>
  </g>

  <!-- ===== Type + palette ===== -->
  <text class="cap" x="680" y="104">TYPOGRAPHY</text>
  <text class="disp" x="680" y="190" font-size="64" letter-spacing="14" fill="#FFFFFF">SYSTEM</text>
  <text class="cap" x="680" y="218" style="letter-spacing:2px">ANURATI &#183; DISPLAY</text>

  <text x="680" y="304" font-size="56" font-weight="300" fill="#FFFFFF">42<tspan font-size="24" fill="#B8B8B8">%</tspan></text>
  <text class="cap" x="680" y="332" style="letter-spacing:2px">QUICKSAND &#183; NUMBERS &amp; LABELS</text>

  <text class="cap" x="680" y="402">PALETTE</text>
  <g stroke="#252525" stroke-width="1">
    <rect x="680"  y="422" width="56" height="56" fill="#FFFFFF"/>
    <rect x="748"  y="422" width="56" height="56" fill="#EAEAEA"/>
    <rect x="816"  y="422" width="56" height="56" fill="#B8B8B8"/>
    <rect x="884"  y="422" width="56" height="56" fill="#858585"/>
    <rect x="952"  y="422" width="56" height="56" fill="#252525"/>
    <rect x="1020" y="422" width="56" height="56" fill="#101010"/>
    <rect x="1088" y="422" width="56" height="56" fill="#FF6A00" stroke="none"/>
  </g>
  <text class="hex" x="708"  y="500">FFFFFF</text>
  <text class="hex" x="776"  y="500">EAEAEA</text>
  <text class="hex" x="844"  y="500">B8B8B8</text>
  <text class="hex" x="912"  y="500">858585</text>
  <text class="hex" x="980"  y="500">252525</text>
  <text class="hex" x="1048" y="500">101010</text>
  <text class="hex" x="1116" y="500">FF6A00</text>

  <text x="680" y="560" font-size="13" font-weight="500" fill="#B8B8B8">Monochrome by design. One orange accent says which GPU is working.</text>
</svg>